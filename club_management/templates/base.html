<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %} College Club Management{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <nav class="navbar">
        <h3> College Club Management System </h3>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'club_list' %}">Clubs</a>
            <a href="{% url 'member_list' %}">Members</a>
            <a href="{% url 'event_list' %}">Events</a>
            <form action="#" method="post">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
