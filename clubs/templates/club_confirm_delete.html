{% extends "base.html" %}
{% block title %}Delete Club{% endblock %}
{% block content %}

<div class="delete-container">
    <h2>Delete Club</h2>
    <p>
        Are you sure you want to delete
        <strong>{{ club.club_name }}</strong>?
    </p>
    <form method="POST" class="delete-form">
        {% csrf_token %}
        <button type="submit" class="delete-btn">
            Yes, Delete
        </button>
        <a href="{% url 'club_list' %}" class="cancel-btn">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
